name: release

permissions:
  contents: read

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build-all:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: gasfmt-linux-x86_64.tar.gz

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            name: gasfmt-linux-aarch64.tar.gz

          - target: x86_64-apple-darwin
            os: macOS-latest
            name: gasfmt-darwin-x86_64.tar.gz

          - target: aarch64-apple-darwin
            os: macOS-latest
            name: gasfmt-darwin-aarch64.tar.gz

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            name: gasfmt-windows-x86_64.tar.gz

          - target: aarch64-pc-windows-msvc
            os: windows-latest
            name: gasfmt-windows-aarch64.tar.gz

    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: ${{ matrix.target }}
          cache: false
      - name: build
        if: matrix.os != 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cargo build --release --locked --target "$TARGET"
      - name: dependencies
        if: matrix.os == 'ubuntu-latest'
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: cross
      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          cross build --release --locked --target "$TARGET"
      - name: package
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        shell: bash
        run: |
          cd "target/$TARGET/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            tar czf "../../../$NAME" gasfmt.exe
          else
            tar czf "../../../$NAME" gasfmt
          fi
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}

  release:
    name: release
    needs: build-all
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # needed to create the github release and upload assets
    steps:
      - name: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: publish # zizmor: ignore[superfluous-actions]
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: "*.tar.gz"
          generate_release_notes: true
