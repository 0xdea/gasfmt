[package]
name = "gasfmt"
version = "0.1.1-alpha"
authors = ["Marco Ivaldi <raptor@0xdeadbeef.info>"]
edition = "2024"
rust-version = "1.88"
description = "Formatter for GNU assembler (GAS) sources."
homepage = "https://0xdeadbeef.info/"
repository = "https://github.com/0xdea/gasfmt"
license = "MIT"
keywords = ["assembly", "formatter", "gas", "arm64", "aarch64"]
categories = ["development-tools", "command-line-utilities"]
exclude = [".cargo/*", ".github/*", ".img/*", ".gitignore", ".gitattributes", "CLAUDE.md", "tests/*"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
similar = "3.2"

[profile.release]
strip = true
lto = true
opt-level = 3
codegen-units = 1
panic = "abort"

[profile.dev]
debug = false

[lints]
workspace = true

[workspace.lints.rust]
missing_docs = { level = "warn" }
elided_lifetimes_in_paths = { level = "warn" }
bare_trait_objects = { level = "warn" }
explicit_outlives_requirements = { level = "warn" }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
restriction = { level = "warn", priority = -1 }
# allow some lints
blanket_clippy_restriction_lints = "allow"
std_instead_of_core = "allow"
std_instead_of_alloc = "allow"
arbitrary_source_item_ordering = "allow"
implicit_return = "allow"
question_mark_used = "allow"
pattern_type_mismatch = "allow"
rest_pattern_accessible_field = "allow"
shadow_reuse = "allow"
shadow_same = "allow"
print_stdout = "allow"
print_stderr = "allow"
single_char_lifetime_names = "allow"
impl_trait_in_params = "allow"
missing_inline_in_public_items = "allow"
inline_modules = "allow"
mod_module_files = "allow"
single_call_fn = "allow"
separated_literal_suffix = "allow"
default_numeric_fallback = "allow"
multiple_crate_versions = "allow"
